name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.22.2
  IMAGE_NAME: cs763-resource-hub
  # Scanners run from pinned official images (the same ones validated locally).
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  SEMGREP_IMAGE: semgrep/semgrep:1.183.0

# Third-party actions are pinned to commit SHAs; the comment gives the release tag.
#
# Every scan is non-blocking: scanners run with exit code 0 and the scan jobs set
# continue-on-error, so findings are reported (job summary + artifacts) but never
# fail the run. Only build/test failures fail the pipeline.

jobs:
  build-test:
    name: Install, build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  docker-image:
    name: Docker image build
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 3

  trivy-fs:
    name: Trivy filesystem scan (dependencies)
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy fs scan
        run: |
          mkdir -p reports
          trivy() { docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" "$@"; }
          trivy fs --scanners vuln,secret,misconfig --skip-dirs reports --exit-code 0 \
            --format json --output reports/trivy-fs.json .
          trivy convert --format sarif --output reports/trivy-fs.sarif reports/trivy-fs.json
          trivy convert --format table reports/trivy-fs.json

      - name: Summary
        if: always()
        run: .github/scripts/trivy-summary.sh "Trivy filesystem scan (dependencies, secrets, Dockerfile)" reports/trivy-fs.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fs-report
          path: reports/

      # GitHub code scanning needs Code Security on private repos; set the repo
      # variable ENABLE_CODE_SCANNING=true once it is available.
      - name: Upload SARIF to code scanning
        if: always() && vars.ENABLE_CODE_SCANNING == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: Trivy image scan
    needs: docker-image
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Trivy image scan
        run: |
          mkdir -p reports
          trivy() { docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP:/images:ro" -w /src "$TRIVY_IMAGE" "$@"; }
          trivy image --input /images/image.tar --scanners vuln,secret --exit-code 0 \
            --format json --output reports/trivy-image.json
          trivy convert --format sarif --output reports/trivy-image.sarif reports/trivy-image.json
          trivy convert --format table --severity HIGH,CRITICAL reports/trivy-image.json

      - name: Summary
        if: always()
        run: .github/scripts/trivy-summary.sh "Trivy image scan (${{ env.IMAGE_NAME }}:${{ github.sha }})" reports/trivy-image.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-report
          path: reports/

      - name: Upload SARIF to code scanning
        if: always() && vars.ENABLE_CODE_SCANNING == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep scan
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan --metrics=off \
            --config p/default --config p/owasp-top-ten --config p/nodejs \
            --config p/typescript --config p/dockerfile --config p/secrets \
            --sarif-output=reports/semgrep.sarif --json-output=reports/semgrep.json

      - name: Summary
        if: always()
        run: .github/scripts/semgrep-summary.sh reports/semgrep.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: reports/

      - name: Upload SARIF to code scanning
        if: always() && vars.ENABLE_CODE_SCANNING == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

  sonarqube:
    name: SonarQube Cloud scan
    needs: build-test
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SonarQube blame and new-code detection

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0

      - name: Summary
        if: always()
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN is not set; SonarQube Cloud scan skipped."
            echo "### SonarQube Cloud: skipped (SONAR_TOKEN not set)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### SonarQube Cloud" >> "$GITHUB_STEP_SUMMARY"
            echo "Results: https://sonarcloud.io/project/overview?id=arastella625_cs763-resource-hub" >> "$GITHUB_STEP_SUMMARY"
          fi
